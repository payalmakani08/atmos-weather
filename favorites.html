
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Favorite Cities | ATMOS Weather</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html"><span class="brand-icon">☀</span> ATMOS <span class="brand-light">WEATHER</span></a>
    <button class="menu-toggle" id="menuToggle" aria-label="Toggle navigation">☰</button>
    <nav class="nav-links" id="navigation">
      <a href="index.html">Home</a><a href="forecast.html">Forecast</a>
      <a class="active" href="favorites.html">Favorites</a><a href="about.html">About</a><a href="settings.html">Settings</a>
    </nav>
  </header>

  <main class="container">
    <section class="page-intro"><p class="eyebrow">YOUR PLACES</p><h1>Favorite cities</h1><p class="muted">Keep the places you check most often close at hand.</p></section>

    <form class="search-form" id="favoriteSearchForm">
      <label class="sr-only" for="favoriteCityInput">Add a favorite city</label>
      <span aria-hidden="true">＋</span>
      <input id="favoriteCityInput" placeholder="Add a city, e.g. Mumbai" required>
      <button class="button" type="submit">Add city</button>
    </form>
    <p class="status-message" id="favoriteStatus" role="status"></p>

    <section class="section-block"><div class="section-heading"><h2>Your saved places</h2><span class="subtle-tag" id="favoriteCount">0 CITIES</span></div>
      <div class="favorite-grid" id="favoriteList"></div>
    </section>
  </main>
  <footer class="site-footer"><p>ATMOS WEATHER · Your places, all in one spot.</p></footer>
  <script src="js/background.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
