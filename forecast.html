<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Atmos Forecast</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <style>

        .forecast-table-wrapper {

            overflow-x: auto;

            border-radius: 20px;

        }


        .forecast-table {

            width: 100%;

            border-collapse: collapse;

            min-width: 700px;

        }


        .forecast-table th {

            padding: 17px;

            text-align: left;

            color: #8fa2bd;

            font-size: 12px;

            text-transform: uppercase;

            letter-spacing: 1px;

            background:
                rgba(255,255,255,.04);

        }


        .forecast-table td {

            padding: 20px 17px;

            border-top:
                1px solid
                rgba(255,255,255,.07);

        }


        .forecast-table tr {

            transition: .25s ease;

        }


        .forecast-table tbody tr:hover {

            background:
                rgba(103,232,249,.07);

        }


        .forecast-weather {

            display: flex;

            align-items: center;

            gap: 12px;

        }


        .forecast-weather-icon {

            font-size: 32px;

        }


        .forecast-date {

            font-weight: 800;

        }


        .forecast-date small {

            display: block;

            margin-top: 5px;

            color: #8190a8;

            font-weight: 400;

        }


        .max-temp {

            font-weight: 900;

            font-size: 18px;

        }


        .min-temp {

            color: #8190a8;

        }


        .rain-chance {

            color: #67e8f9;

        }


        @media(max-width:700px) {

            .forecast-table-wrapper {

                margin:
                    0 -5px;

            }

        }

    </style>

</head>


<body>

<canvas id="weather3D"></canvas>


<header class="navbar">

    <a
        href="index.html"
        class="logo"
    >
        🌤️ ATMOS
    </a>


    <nav class="nav-links">

        <a href="index.html">
            Home
        </a>

        <a href="forecast.html">
            Forecast
        </a>

        <a href="favorites.html">
            Favorites
        </a>

        <a href="about.html">
            About
        </a>

        <a href="settings.html">
            Settings
        </a>

    </nav>

</header>


<main class="container">


    <section class="hero">

        <div class="hero-badge">
            📅 7 DAY FORECAST
        </div>


        <h1>

            Weather

            <span>
                Forecast.
            </span>

        </h1>


        <p id="forecastLocation">
            Loading location...
        </p>

    </section>


    <section class="details-section">

        <div class="section-heading">

            <h2>
                📅 Extended Forecast
            </h2>

            <p>
                Daily weather conditions, temperatures and rain probability.
            </p>

        </div>


        <div class="forecast-table-wrapper">

            <table class="forecast-table">

                <thead>

                    <tr>

                        <th>
                            Day
                        </th>

                        <th>
                            Weather
                        </th>

                        <th>
                            Condition
                        </th>

                        <th>
                            Temperature
                        </th>

                        <th>
                            Rain
                        </th>

                        <th>
                            UV
                        </th>

                    </tr>

                </thead>


                <tbody
                    id="forecastTable"
                ></tbody>

            </table>

        </div>

    </section>


</main>


<footer>

    © 2026 Atmos Weather by Payal Makani

</footer>


<script
    src="https://cdn.jsdelivr.net/npm/suncalc@1.9.0/suncalc.js"
></script>

<script src="js/weather3d.js"></script>

<script src="js/forecast.js"></script>


</body>

</html>
